name: Security quality gate

on:
  push:
    branches: [main, production-deployment]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: trustvault
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trustvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_URL: http://127.0.0.1:3002
      E2E_BASE_URL: http://127.0.0.1:3002
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trustvault
      DIRECT_URL: postgresql://postgres@127.0.0.1:5432/trustvault
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trustvault
      AUDIT_HMAC_KEY_VERSION: "1"
      DEMO_ADMIN_EMAIL: admin@trustvault.local
      DEMO_OWNER_EMAIL: owner@trustvault.local
      DEMO_VIEWER_EMAIL: viewer@trustvault.local
      R2_BUCKET_NAME: trustvault-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          write_secret() {
            local name="$1"
            local value="$2"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }
          write_secret BETTER_AUTH_SECRET "$(openssl rand -hex 32)"
          write_secret AUDIT_HMAC_KEYS "{\"1\":\"$(openssl rand -base64 32 | tr -d '\n')\"}"
          write_secret DEMO_ADMIN_PASSWORD "$(openssl rand -hex 24)"
          write_secret DEMO_OWNER_PASSWORD "$(openssl rand -hex 24)"
          write_secret DEMO_VIEWER_PASSWORD "$(openssl rand -hex 24)"
          write_secret R2_ACCOUNT_ID "$(openssl rand -hex 16)"
          write_secret R2_ACCESS_KEY_ID "$(openssl rand -hex 16)"
          write_secret R2_SECRET_ACCESS_KEY "$(openssl rand -hex 32)"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:demo
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
